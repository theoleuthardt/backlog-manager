version: "3"

vars:
  BACKEND_DIR: backend
  APP_DIR: app
  MONITOR_DIR: monitor
  APP_PLATFORM: '{{if eq OS "darwin"}}macos{{else}}{{OS}}{{end}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install backend, Flutter app and Monitor dependencies
    cmds:
      - task: backend:install
      - task: app:install
      - task: monitor:install

  lint:
    desc: Lint backend, Flutter app and Monitor
    cmds:
      - task: backend:lint
      - task: app:lint
      - task: monitor:lint

  test:
    desc: Run the backend, Flutter app, Monitor and release script test suites
    cmds:
      - task: backend:test
      - task: app:test
      - task: monitor:test
      - task: release:test

  check:
    desc: Lint + format-check the backend, the Flutter app and the Monitor
    cmds:
      - task: backend:lint
      - task: app:lint
      - task: monitor:lint
      - task: format:check

  format:
    desc: Format the backend (ruff format), Flutter app (dart format) and Monitor (Spotless)
    cmds:
      - task: backend:format
      - task: app:format
      - task: monitor:format

  format:check:
    desc: Check backend, Flutter app and Monitor formatting without changing files
    cmds:
      - task: backend:format:check
      - task: app:format:check
      - task: monitor:format:check

  db:up:
    desc: Start local Postgres + pgAdmin via compose.yml
    cmds:
      - podman compose up -d db db-monitoring

  db:down:
    desc: Stop the local Postgres + pgAdmin (only those two services)
    cmds:
      - podman compose stop db db-monitoring

  release:test:
    desc: Test the release pipeline's scripts (app update manifest, release version)
    cmds:
      - node --test scripts/app-update-manifest.test.mjs scripts/release-version.test.mjs

  backend:install:
    desc: Install backend dependencies (uv sync)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv sync

  backend:dev:
    desc: Start the Litestar dev server
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run uvicorn backlog_manager_backend.app:app --reload --port 8000

  backend:lint:
    desc: Lint the backend (ruff)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff check .

  backend:format:
    desc: Format the backend (ruff format)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff format .

  backend:format:check:
    desc: Check backend formatting without changing files
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff format --check .

  backend:test:
    desc: Run backend tests (pytest, against a real Postgres via testcontainers)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run pytest

  backend:audit:
    desc: Audit the backend's locked dependencies for known vulnerabilities (pip-audit)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - defer: rm -f .audit-requirements.txt
      - uv export --no-dev --no-hashes --no-emit-project --frozen -o .audit-requirements.txt
      - uvx pip-audit --no-deps --disable-pip --ignore-vuln PYSEC-2026-1325 -r .audit-requirements.txt

  audit:
    desc: Audit the backend dependencies for known vulnerabilities
    cmds:
      - task: backend:audit

  backend:migrate:
    desc: Apply pending Alembic migrations
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic upgrade head

  backend:migration:
    desc: 'Create a new Alembic migration: task backend:migration -- "message"'
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  backend:openapi:
    desc: Regenerate backend/openapi.json from the current route handlers
    dir: "{{.BACKEND_DIR}}"
    env:
      PYTHONHASHSEED: "0"
    cmds:
      - uv run python scripts/dump_openapi_schema.py

  app:install:
    desc: Fetch the Flutter app's dependencies (needs Flutter, see docs/FLUTTER.md)
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter pub get

  app:dev:
    desc: Run the Flutter desktop app on this platform
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter run -d {{.APP_PLATFORM}}

  app:lint:
    desc: Analyze the Flutter app (flutter analyze)
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter analyze

  app:test:
    desc: Run the Flutter app's tests (per-test and overall time limit, hung test processes are killed)
    dir: "{{.APP_DIR}}"
    cmds:
      - tool/test/run.sh {{.CLI_ARGS}}

  app:test:integration:
    desc: Run the Flutter app's integration tests against an in-memory backend (needs a display, see docs/FLUTTER.md)
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter drive --driver=test_driver/integration_test.dart --target=integration_test/main_flows_test.dart -d {{.APP_PLATFORM}}

  app:test:update-goldens:
    desc: Re-record the Flutter app's golden images (review the image diff before committing)
    dir: "{{.APP_DIR}}"
    cmds:
      - tool/test/run.sh --update-goldens {{.CLI_ARGS}}

  app:format:
    desc: Format the Flutter app (dart format)
    dir: "{{.APP_DIR}}"
    cmds:
      - dart format .

  app:format:check:
    desc: Check the Flutter app's formatting without changing files
    dir: "{{.APP_DIR}}"
    cmds:
      - dart format --output=none --set-exit-if-changed .

  app:generate-api:
    desc: Regenerate the Dart API client from backend/openapi.json (run backend:openapi first after a route change)
    dir: "{{.APP_DIR}}"
    cmds:
      - dart run swagger_parser
      - dart run build_runner build --delete-conflicting-outputs
      - dart format lib/api/generated

  app:build:
    desc: 'Build the Flutter app for this platform; default server: task app:build API_URL=https://api.example.com'
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter build {{.APP_PLATFORM}}{{if .API_URL}} --dart-define=API_URL={{.API_URL}}{{end}}

  app:build:apk:
    desc: 'Build a debug Android APK (release signing comes with #520); default server: task app:build:apk API_URL=https://api.example.com'
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter build apk --debug{{if .API_URL}} --dart-define=API_URL={{.API_URL}}{{end}}

  app:build:ios:
    desc: 'Build the iOS app without code signing and pack it as an unsigned IPA into app/dist (needs macOS and Xcode); default server: task app:build:ios API_URL=https://api.example.com'
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter build ios --release --no-codesign{{if .API_URL}} --dart-define=API_URL={{.API_URL}}{{end}}
      - bash tool/package/ipa.sh

  app:dev:mobile:
    desc: 'Run the app on a connected Android or iOS device or emulator: task app:dev:mobile DEVICE=<id from flutter devices>'
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter run{{if .DEVICE}} -d {{.DEVICE}}{{end}}

  app:icons:
    desc: Regenerate the app icons (macOS, Windows, Linux, iOS, Android) from app/tool/icons/icon.svg (needs rsvg-convert and ImageMagick)
    dir: "{{.APP_DIR}}"
    cmds:
      - bash tool/icons/generate.sh

  app:package:
    desc: 'Package the Flutter app for this OS (Fastforge: DEB, DMG, EXE installer; AppImage and RPM through tool/package/appimage.sh and rpm.sh) into app/dist; default server: task app:package API_URL=https://api.example.com'
    dir: "{{.APP_DIR}}"
    vars:
      PACKAGE_TARGETS: '{{if eq OS "darwin"}}dmg{{else if eq OS "windows"}}exe{{else}}deb{{end}}'
      PACKAGE_ARCH: '{{if eq OS "darwin"}}universal{{else}}x64{{end}}'
    cmds:
      - dart pub global activate fastforge 0.6.12
      - dart pub global run fastforge:main package --platform {{.APP_PLATFORM}} --targets {{.PACKAGE_TARGETS}} --artifact-name "Backlog-Manager_{{`{{build_name}}`}}_{{.APP_PLATFORM}}_{{.PACKAGE_ARCH}}.{{`{{ext}}`}}"{{if .API_URL}} --build-dart-define=API_URL={{.API_URL}}{{end}}
      - cmd: bash tool/package/appimage.sh
        platforms: [linux]
      - cmd: bash tool/package/check_appimage.sh
        platforms: [linux]
      - cmd: bash tool/package/rpm.sh
        platforms: [linux]

  monitor:install:
    desc: Download the Monitor's Maven dependencies and plugins (needs a JDK 25, see monitor/README.md)
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B -q dependency:go-offline

  monitor:dev:
    desc: Run the Monitor (Spring Boot, profile dev) on http://localhost:8090 against the local Postgres
    dir: "{{.MONITOR_DIR}}"
    dotenv: ["{{.ROOT_DIR}}/.env"]
    cmds:
      - ./mvnw spring-boot:run

  monitor:db:create:
    desc: Create the Monitor's role and database in the local Postgres (task db:up first; safe to re-run)
    dotenv: ["{{.ROOT_DIR}}/.env"]
    cmds:
      - bash postgres/create-monitor-db.bash

  monitor:lint:
    desc: Compile the Monitor and its tests with -Xlint:all -Werror
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B -q test-compile

  monitor:test:
    desc: Run the Monitor's tests
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B test

  monitor:build:
    desc: Build the Monitor's executable jar (monitor/target/), tests included
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B package

  monitor:format:
    desc: Format the Monitor (Spotless with palantir-java-format)
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B -q spotless:apply

  monitor:format:check:
    desc: Check the Monitor's formatting without changing files
    dir: "{{.MONITOR_DIR}}"
    cmds:
      - ./mvnw -B -q spotless:check

  vscode:setup-python:
    desc: Point VS Code/VSCodium's Python tooling at backend/.venv (run once per machine/checkout)
    cmds:
      - bash scripts/setup-vscode-python.bash
