version: "3"

vars:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  APP_DIR: app
  APP_PLATFORM: '{{if eq OS "darwin"}}macos{{else}}{{OS}}{{end}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install frontend, backend and Flutter app dependencies
    cmds:
      - task: frontend:install
      - task: backend:install
      - task: app:install

  dev:
    desc: Run the Vite and backend dev servers
    deps:
      - task: frontend:dev
      - task: backend:dev

  build:
    desc: Build the frontend for production
    cmds:
      - task: frontend:build

  lint:
    desc: Lint frontend and backend
    cmds:
      - task: frontend:lint
      - task: backend:lint
      - task: app:lint

  test:
    desc: Run the backend and frontend test suites
    cmds:
      - task: backend:test
      - task: frontend:test
      - task: app:test
      - task: release:test

  check:
    desc: Lint + typecheck + format-check the frontend, lint + format-check the backend
    cmds:
      - task: frontend:check
      - task: backend:lint
      - task: app:lint
      - task: format:check

  format:
    desc: Format the frontend (prettier) and backend (ruff format)
    cmds:
      - task: frontend:format
      - task: backend:format
      - task: app:format

  format:check:
    desc: Check frontend and backend formatting without changing files
    cmds:
      - task: frontend:format:check
      - task: backend:format:check
      - task: app:format:check

  db:up:
    desc: Start local Postgres + pgAdmin via compose.yml
    cmds:
      - podman compose up -d db db-monitoring

  db:down:
    desc: Stop the local Postgres + pgAdmin (only those two services)
    cmds:
      - podman compose stop db db-monitoring

  frontend:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install

  frontend:dev:
    desc: Start the Vite dev server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the Vite app for production
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build

  frontend:lint:
    desc: Lint the frontend (eslint)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run lint

  frontend:check:
    desc: Lint + typecheck the frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run check

  frontend:format:
    desc: Format the frontend (prettier)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format:write

  frontend:format:check:
    desc: Check frontend formatting without changing files
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format:check

  frontend:test:
    desc: Run the frontend unit tests (vitest)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm test

  release:test:
    desc: Test the release pipeline's scripts (updater manifest, release version)
    cmds:
      - node --test scripts/updater-manifest.test.mjs scripts/release-version.test.mjs

  backend:install:
    desc: Install backend dependencies (uv sync)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv sync

  backend:dev:
    desc: Start the Litestar dev server
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run uvicorn backlog_manager_backend.app:app --reload --port 8000

  backend:lint:
    desc: Lint the backend (ruff)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff check .

  backend:format:
    desc: Format the backend (ruff format)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff format .

  backend:format:check:
    desc: Check backend formatting without changing files
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff format --check .

  backend:test:
    desc: Run backend tests (pytest, against a real Postgres via testcontainers)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run pytest

  backend:audit:
    desc: Audit the backend's locked dependencies for known vulnerabilities (pip-audit)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - defer: rm -f .audit-requirements.txt
      - uv export --no-dev --no-hashes --no-emit-project --frozen -o .audit-requirements.txt
      - uvx pip-audit --no-deps --disable-pip --ignore-vuln PYSEC-2026-1325 -r .audit-requirements.txt

  frontend:audit:
    desc: Audit the frontend's production dependencies for known vulnerabilities
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm audit --omit=dev

  audit:
    desc: Audit frontend and backend dependencies for known vulnerabilities
    cmds:
      - task: backend:audit
      - task: frontend:audit

  backend:migrate:
    desc: Apply pending Alembic migrations
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic upgrade head

  backend:migration:
    desc: 'Create a new Alembic migration: task backend:migration -- "message"'
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  backend:openapi:
    desc: Regenerate backend/openapi.json from the current route handlers
    dir: "{{.BACKEND_DIR}}"
    env:
      PYTHONHASHSEED: "0"
    cmds:
      - uv run python scripts/dump_openapi_schema.py

  frontend:generate-api-types:
    desc: Regenerate the type-safe API client types from backend/openapi.json
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run generate-api-types

  frontend:tauri:dev:
    desc: Run the desktop app in dev mode (see docs/TAURI.md)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run tauri:dev

  frontend:tauri:build:
    desc: Build desktop installers for the current platform (see docs/TAURI.md)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run tauri:build

  frontend:tauri:build:debug:
    desc: Build an unoptimized debug desktop build (faster, easier to troubleshoot)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run tauri:build:debug

  app:install:
    desc: Fetch the Flutter app's dependencies (needs Flutter, see docs/FLUTTER.md)
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter pub get

  app:dev:
    desc: Run the Flutter desktop app on this platform
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter run -d {{.APP_PLATFORM}}

  app:lint:
    desc: Analyze the Flutter app (flutter analyze)
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter analyze

  app:test:
    desc: Run the Flutter app's tests
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter test

  app:format:
    desc: Format the Flutter app (dart format)
    dir: "{{.APP_DIR}}"
    cmds:
      - dart format .

  app:format:check:
    desc: Check the Flutter app's formatting without changing files
    dir: "{{.APP_DIR}}"
    cmds:
      - dart format --output=none --set-exit-if-changed .

  app:generate-api:
    desc: Regenerate the Dart API client from backend/openapi.json (run backend:openapi first after a route change)
    dir: "{{.APP_DIR}}"
    cmds:
      - dart run swagger_parser
      - dart run build_runner build --delete-conflicting-outputs
      - dart format lib/api/generated

  app:build:
    desc: Build the Flutter app for this platform
    dir: "{{.APP_DIR}}"
    cmds:
      - flutter build {{.APP_PLATFORM}}

  vscode:setup-python:
    desc: Point VS Code/VSCodium's Python tooling at backend/.venv (run once per machine/checkout)
    cmds:
      - bash scripts/setup-vscode-python.bash
