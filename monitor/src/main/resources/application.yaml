spring:
  application:
    name: monitor
  profiles:
    default: dev

monitor:
  scheduler-tick: ${MONITOR_SCHEDULER_TICK:5s}
  http-default-timeout: ${MONITOR_HTTP_DEFAULT_TIMEOUT:10s}
  retention-days: ${MONITOR_RETENTION_DAYS:30}
  push-message-max-length: ${MONITOR_PUSH_MESSAGE_MAX_LENGTH:200}
