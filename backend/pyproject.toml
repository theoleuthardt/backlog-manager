[project]
name = "backlog-manager-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "theoleuthardt", email = "theoleuthardt12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "litestar[standard]>=2.24.0",
    "msgspec>=0.21.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[project.scripts]
backlog-manager-backend = "backlog_manager_backend:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# db.py's engine is a module-level singleton bound to one event loop; a
# per-test loop (pytest-asyncio's default) causes "Event loop is closed"
# errors when the pool later tries to recycle a connection from a
# different, already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# alembic revision --autogenerate produces this boilerplate every time;
# holding it to the same lint standard as hand-written code is just noise.
extend-exclude = ["alembic/versions"]
