name: backlog_manager
description: "Backlog Manager desktop client."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.6

dependencies:
  cached_network_image: ^4.0.4
  desktop_drop: ^0.7.0
  dio: ^5.11.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  swagger_parser: ^1.45.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:

  uses-material-design: true
  assets:
    - assets/royalcdkeys-icon.png
    - assets/premiumcdkeys-icon.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
dependency_overrides:
  analyzer: ">=13.3.0 <14.0.0"

