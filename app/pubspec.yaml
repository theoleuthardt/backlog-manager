name: backlog_manager
description: "Backlog Manager desktop client."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.6

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  swagger_parser: ^1.45.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:

  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
dependency_overrides:
  analyzer: ">=13.3.0 <14.0.0"

