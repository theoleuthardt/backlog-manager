services:
  backlog-manager:
    env_file: .env
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        # Always "production" here, regardless of .env's own NODE_ENV
        # (which describes the overall local-dev vs. deployed flavor of
        # the stack, not this specific build step) - `next build` only
        # ever produces one correct kind of output, and passing
        # "development" through as a literal NODE_ENV during the build
        # silently mixes React's dev/prod runtimes across chunks,
        # crashing prerendering with a misleading null useContext/
        # useState error on a random page each time. Pre-existing bug in
        # this exact args block, just never exercised until this issue's
        # compose wiring added the first real end-to-end
        # `podman compose up --build` test.
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      - NODE_ENV=production
      # Explicitly 0.0.0.0, not .env's own HOSTNAME=localhost (meant for
      # human-readable dev logging elsewhere, and loaded into this
      # container regardless via env_file above unless overridden here)
      # - the standalone Next.js server binds exactly to whatever
      # HOSTNAME says, and "localhost" resolves to the IPv6 loopback
      # (::1) inside the container, which the port mapping below can't
      # reach from outside. 0.0.0.0 means all interfaces within the
      # container's own network namespace.
      - HOSTNAME=0.0.0.0
      - PORT=${NEXTJS_PORT}
    ports:
      - "${NEXTJS_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    env_file: .env
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - AUTH_SECRET=${AUTH_SECRET}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: postgres-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    restart: unless-stopped

  db-monitoring:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

volumes:
  postgres_data:
