services:
  backlog-manager:
    env_file: .env
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        # Not .env's NODE_ENV - `next build` always needs "production".
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      - NODE_ENV=production
      # Not .env's HOSTNAME=localhost - the container needs to bind all
      # interfaces to be reachable via the port mapping below.
      - HOSTNAME=0.0.0.0
      - PORT=${NEXTJS_PORT}
    ports:
      - "${NEXTJS_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    env_file: .env
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - AUTH_SECRET=${AUTH_SECRET}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: postgres-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    restart: unless-stopped

  db-monitoring:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

volumes:
  postgres_data:
