name: Build & Publish

# Builds the frontend and backend container images and publishes them to
# GitHub Container Registry (ghcr.io) - only after a merge to main, never
# on open pull requests (see build.yml for the PR-time test-build).
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: Validate publish configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: test -n "$NEXT_PUBLIC_API_URL"

  publish-frontend:
    name: Build & Publish Frontend Image
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: true
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/backlog-manager-frontend:latest
            ghcr.io/${{ github.repository_owner }}/backlog-manager-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/backlog-manager-frontend
          SHA: ${{ github.sha }}
        run: |
          echo "### Frontend image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          printf 'Published `%s:%s` (also tagged `latest`)\n' "$IMAGE" "$SHA" >> "$GITHUB_STEP_SUMMARY"

  publish-backend:
    name: Build & Publish Backend Image
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backlog-manager-backend:latest
            ghcr.io/${{ github.repository_owner }}/backlog-manager-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/backlog-manager-backend
          SHA: ${{ github.sha }}
        run: |
          echo "### Backend image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          printf 'Published `%s:%s` (also tagged `latest`)\n' "$IMAGE" "$SHA" >> "$GITHUB_STEP_SUMMARY"
