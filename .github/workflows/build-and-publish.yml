name: Build & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    name: Build & Publish Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backlog-manager-backend:latest
            ghcr.io/${{ github.repository_owner }}/backlog-manager-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/backlog-manager-backend
          SHA: ${{ github.sha }}
        run: |
          echo "### Backend image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          printf 'Published `%s:%s` (also tagged `latest`)\n' "$IMAGE" "$SHA" >> "$GITHUB_STEP_SUMMARY"
