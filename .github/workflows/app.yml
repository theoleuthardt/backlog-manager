name: App

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/openapi.json"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: App Analyze, Format, Client and Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check that the generated API client is up to date
        run: |
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/api/generated
          git diff --exit-code -- lib/api/generated

      - name: Run tests
        run: tool/test/run.sh --exclude-tags golden

  goldens:
    name: App Golden Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore

  linux-build:
    name: App Linux Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package the AppImage
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash tool/package/appimage.sh
          bash tool/package/check_appimage.sh

  integration:
    name: App Integration Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build and display dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb xauth

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests
        run: >
          xvfb-run -a -s "-screen 0 1440x900x24"
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/main_flows_test.dart
          -d linux

  android-build:
    name: App Android Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build apk --debug

  ios-build:
    name: App iOS Build
    runs-on: macos-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Pack the unsigned IPA
        run: bash tool/package/ipa.sh
