name: Backend Docker Build & Push

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Docker image tag'
        required: false
        default: 'latest'
        type: string
      push_to_dockerhub:
        description: 'Push image to DockerHub'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and Push to DockerHub if requested
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub }}
          tags: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, 'backlog-manager-backend', inputs.image_tag) || format('backlog-manager-backend:{0}', github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "### Backend Docker Build Successful :rocket:" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_to_dockerhub }}" = "true" ]; then
            printf 'Image built and pushed to DockerHub with tag: `%s/backlog-manager-backend:%s`\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'Image built successfully with tag: `backlog-manager-backend:%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image built successfully with tag: \`backlog-manager-backend:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
