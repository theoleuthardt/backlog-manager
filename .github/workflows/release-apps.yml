name: Release Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: compute
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION=$(node -p "require('./frontend/package.json').version")
          else
            BASE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop apps
    needs: version
    uses: ./.github/workflows/tauri-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: backlog-manager-*
          path: dist
          merge-multiple: true

      - name: Generate updater manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: node scripts/updater-manifest.mjs dist "$VERSION" "$TAG" "$REPO"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Backlog Manager ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*

      - name: Release summary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "### Release published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Backlog Manager \`$TAG\` - see the Releases page for download links." >> "$GITHUB_STEP_SUMMARY"
