name: Release Flutter App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version as X.Y.Z (empty = bump the patch of the latest release)
        required: false
        type: string
        default: ""
      publish:
        description: Publish a GitHub Release (off = dry run, installers only as workflow artifacts)
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release (only the Preview update channel offers it)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute release version
        id: compute
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          PACKAGE_VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          node scripts/release-version.mjs "$LATEST_TAG" "$PACKAGE_VERSION" "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            platform: linux
          - name: macOS
            runner: macos-latest
            platform: macos
          - name: Windows
            runner: windows-latest
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev rpm file
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'macos'
        run: npm install -g appdmg

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Install Task
        run: npm install -g @go-task/cli

      - name: Stamp app version
        shell: bash
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH format, got: $VERSION" >&2
            exit 1
          }
          sed -i.bak "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build and package
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: task app:package API_URL="$API_URL"

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: backlog-manager-app-${{ matrix.platform }}
          if-no-files-found: error
          path: app/dist/*/Backlog-Manager_*

  android:
    name: Build Android
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Stamp app version
        shell: bash
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH format, got: $VERSION" >&2
            exit 1
          }
          sed -i.bak "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is missing; see docs/FLUTTER.md (Release workflow)." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: app
        env:
          API_URL: ${{ vars.API_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=API_URL="$API_URL"
          full_version=$(sed -n 's/^version: *\([^ ]*\).*/\1/p' pubspec.yaml)
          mkdir -p "dist/$full_version"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$full_version/Backlog-Manager_${VERSION}_android_arm64.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify "dist/$full_version/Backlog-Manager_${VERSION}_android_arm64.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: backlog-manager-app-android
          if-no-files-found: error
          path: app/dist/*/Backlog-Manager_*

  ios:
    name: Build iOS
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true

      - name: Stamp app version
        shell: bash
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH format, got: $VERSION" >&2
            exit 1
          }
          sed -i.bak "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build the unsigned IPA
        working-directory: app
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          flutter build ios --release --no-codesign --dart-define=API_URL="$API_URL"
          bash tool/package/ipa.sh

      - name: Upload the IPA
        uses: actions/upload-artifact@v6
        with:
          name: backlog-manager-app-ios
          if-no-files-found: error
          path: app/dist/*/Backlog-Manager_*

  release:
    name: Publish GitHub Release
    needs: [version, build, android, ios]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes and scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/release-install-notes.md
            scripts/app-update-manifest.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: backlog-manager-app-*
          path: dist
          merge-multiple: true

      - name: Sign the installers for in-place updates
        env:
          APP_UPDATE_PRIVATE_KEY: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/app-update-manifest.mjs dist "$VERSION" "$TAG" "$REPOSITORY"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body_path: .github/release-install-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*

      - name: Release summary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "### Flutter app release published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Backlog Manager \`$TAG\` - see the Releases page for download links." >> "$GITHUB_STEP_SUMMARY"
