name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Backend image to deploy, a full git SHA of main (empty = the commit this workflow runs on)
        required: false
        type: string
        default: ""
      force:
        description: Deploy even when that image already runs (to roll out a changed compose.prod.yml; the database restarts once if its config changed)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.actor == 'theoleuthardt' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, deploy]
    environment: production
    timeout-minutes: 20

    steps:
      - name: Run deploy.sh on the production host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE_REF: ${{ inputs.image_ref || github.sha }}
          FORCE: ${{ inputs.force && 'force ' || '' }}
        run: |
          test -n "$DEPLOY_HOST"
          started=$(date +%s)
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "deploy ${FORCE}${IMAGE_REF}" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Backend deployment"
            echo
            echo "- image: \`$IMAGE_REF\`${FORCE:+ (forced)}"
            echo "- duration: $(( $(date +%s) - started )) s"
            echo "- result: $([ "$status" = 0 ] && echo succeeded || echo "failed (exit $status)")"
            echo
            echo '```'
            grep '^deploy:' deploy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
