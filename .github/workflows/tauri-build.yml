name: Tauri Build

# Builds the desktop app for Windows, macOS and Linux. Only builds
# installers - it does not sign or publish them (see issue #14's own "Code
# Signing" section - that needs real certificates this workflow doesn't
# have). Callable in two ways:
#   - workflow_dispatch: manual ad-hoc build for testing, using whatever
#     version is already committed in package.json/tauri.conf.json.
#   - workflow_call: invoked by release-apps.yml with an explicit `version`
#     input, which gets stamped into the build before it runs. No tag-push
#     trigger here - release-apps.yml is the only thing that creates release
#     tags, and it already calls this workflow directly, so a tag-push
#     trigger would just build everything a second time.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into package.json/tauri.conf.json (e.g. 1.2.3). Leave empty to build the version already committed."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp app version
        if: inputs.version != ''
        working-directory: frontend
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH format, got: $VERSION" >&2
            exit 1
          }
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build Tauri app
        working-directory: frontend
        env:
          # Baked into the static export at build time - same variable the
          # web/container publish workflow uses.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backlog-manager-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
