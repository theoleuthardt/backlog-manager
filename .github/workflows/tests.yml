name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "deploy/**"
      - ".nvmrc"
      - ".github/workflows/tests.yml"

jobs:
  release-scripts:
    name: Release Script Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run release script tests
        run: node --test scripts/release-version.test.mjs scripts/app-update-manifest.test.mjs deploy/deploy.test.mjs deploy/backup.test.mjs deploy/crons.test.mjs
