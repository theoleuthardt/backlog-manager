name: Docker Build & Push

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Docker image tag'
        required: false
        default: 'latest'
        type: string
      push_to_dockerhub:
        description: 'Push image to DockerHub'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build NextJS Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and Push to DockerHub if requested
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub }}
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_dockerhub && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, 'backlog-manager', inputs.image_tag) || format('backlog-manager:{0}', github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "### Docker Build Successful :rocket:" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_to_dockerhub }}" = "true" ]; then
            printf 'Image built and pushed to DockerHub with tag: `%s/backlog-manager:%s`\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'Image built successfully with tag: `backlog-manager:%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image built successfully with tag: \`backlog-manager:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
