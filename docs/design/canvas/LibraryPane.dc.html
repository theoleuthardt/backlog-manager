<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library pane</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shelf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="shelf {{themeClass}}" style="width: 1208px; height: 820px; color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden;">
  <div class="toolbar">
        <span style="font-weight: 800;">Library</span><span class="muted small">148 games</span>
        <button type="button" class="btn" style="margin-left: auto;">Select</button>
        <button type="button" class="btn btn-primary">+ Add game</button>
      </div>
      <div class="filterbar" role="group" aria-label="Filters">
        <span class="muted" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; padding-right: 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>Filter</span>
        <span class="token"><b>Status</b> In Progress<span class="x" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></span>
        <button type="button" class="token-add">+ Add filter</button>
        <span style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
          <span class="muted small">Sort</span><button type="button" class="btn" style="height: 26px;">Status &#9662;</button>
          <div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="true">Grid</button><button type="button" aria-pressed="false">List</button></div>
        </span>
      </div>
  <div class="scroll">
    <div class="covers">
      <sc-for list="{{games}}" as="g" hint-placeholder-count="12">
        <div><div class="cover" style="background: {{g.bg}};">{{g.title}}</div><div class="cover-meta">{{g.meta}}</div></div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"text","default":"oled"},"$preview":{"width":1208,"height":820}}'>
class Component extends DCLogic {
  renderVals() { const themeClass = 'theme-' + (this.props.theme ?? 'oled');
    const cover = (a, b) => 'linear-gradient(160deg, ' + a + ', ' + b + ')';
    const list = [
      ['Hades', '#9a2a42', '#2a0a1a', '18 of 22 h'], ['Elden Ring', '#c99a3a', '#3a2a0c', '41 of 60 h'],
      ['Hollow Knight', '#2a5aa8', '#0a1430', '9 of 27 h'], ['Outer Wilds', '#d2641e', '#2a1006', '6 of 16 h'],
      ['Celeste', '#2a8a8a', '#0e3a44', '8 h to beat'], ['Portal 2', '#6a7a8a', '#1e2a36', '9 h to beat'],
      ['Disco Elysium', '#8a4a22', '#2a1408', '24 h to beat'], ['Stardew Valley', '#4a9a34', '#12300c', '53 h to beat'],
      ['Tunic', '#4a8a6a', '#0e2a1e', '12 h to beat'], ['Inside', '#5a6a74', '#12181c', '4 h to beat'],
      ['Cuphead', '#c2a21e', '#3a2a06', '8 h to beat'], ['Journey', '#d28a3a', '#3a1c08', '3 h to beat'],
      ['Limbo', '#8a8a8a', '#1a1a1a', '5 h to beat'], ['Hotline Miami', '#d22a7a', '#2a0a1e', '6 h to beat']
    ];
    return { themeClass, games: list.map((g) => ({ title: g[0], bg: cover(g[1], g[2]), meta: g[3] })) };
  }
}
</script>
</body>
</html>
