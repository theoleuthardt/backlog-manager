<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shelf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="shelf account-row {{themeClass}}" style="width: 232px; margin-top: 0; color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif;">
  <span class="avatar">TH</span>
  <div style="line-height: 1.2; min-width: 0; flex: 1;">
    <div class="name">Theo</div>
    <div class="mail">theo@example.com</div>
  </div>
  <button type="button" class="tb-btn" aria-label="Account menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"text","default":"oled"},"$preview":{"width":232,"height":58}}'>
class Component extends DCLogic {
  renderVals() { const themeClass = 'theme-' + (this.props.theme ?? 'oled'); return { themeClass}; }
}
</script>
</body>
</html>
