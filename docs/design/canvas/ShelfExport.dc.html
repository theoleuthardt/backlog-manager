<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSV export</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shelf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="shelf win {{themeClass}}">
  <dc-import name="Titlebar" title="Library" search="yes" hint-size="100%,52px"></dc-import>
  <div class="win-body">
    <div class="sidebar-col"><dc-import name="SidebarNav" active="export" hint-size="232px,560px"></dc-import><div style="margin-top: auto;"><dc-import name="SidebarAccount" hint-size="232px,58px"></dc-import></div></div>
    <div class="win-main"><dc-import name="LibraryPane" hint-size="1208px,820px"></dc-import></div>
  </div>
  <dc-import name="StatusBar" left="148 games" hint-size="100%,28px"></dc-import>

  <div class="sheet-scrim">
    <section class="sheet" aria-label="Export backlog" style="width: 520px;">
      <div class="sheet-head"><h1 class="h-page" style="font-size: 20px;">Export backlog</h1><p class="muted" style="margin: 6px 0 0;">Save all your entries as a CSV file you can open in any spreadsheet.</p></div>
      <div class="sheet-body">
        <div class="group">
          <div class="frow"><div class="fl" style="flex-basis: 150px;">Scope</div><div class="fc" style="justify-content: flex-end;"><div class="seg"><button type="button" aria-pressed="true">Personal</button><button type="button" aria-pressed="false">Shared space</button></div></div></div>
          <div class="frow"><div class="fl" style="flex-basis: 150px;">Entries<small>148 games</small></div><div class="fc" style="justify-content: flex-end;"><span class="chip">All statuses</span></div></div>
          <div class="frow"><div class="fl" style="flex-basis: 150px;">Include reviews and notes</div><div class="fc" style="justify-content: flex-end;"><span class="switch switch-on" role="switch" aria-checked="true" aria-label="Include reviews and notes"></span></div></div>
        </div>
      </div>
      <div class="sheet-foot"><button type="button" class="btn btn-quiet">Cancel <span class="kbd">esc</span></button><button type="button" class="btn btn-primary" style="margin-left: auto;">Save as CSV...</button></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["oled","light","colorful","freaky"],"default":"oled"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { const themeClass = 'theme-' + (this.props.theme ?? 'oled'); return { themeClass}; }
}
</script>
</body>
</html>
