<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shelf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="shelf win {{themeClass}}">
  <dc-import name="Titlebar" title="Library" search="yes" hint-size="100%,52px"></dc-import>
  <div class="win-body">
    <div class="sidebar-col"><dc-import name="SidebarNav" active="library" hint-size="232px,560px"></dc-import><div style="margin-top: auto;"><dc-import name="SidebarAccount" hint-size="232px,58px"></dc-import></div></div>
    <div class="win-main"><dc-import name="LibraryPane" hint-size="1208px,820px"></dc-import></div>
  </div>
  <dc-import name="StatusBar" left="148 games" hint-size="100%,28px"></dc-import>

  <div class="sheet-scrim">
    <section class="sheet" aria-label="Command palette" style="width: 640px; height: fit-content; max-height: 620px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted);" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" value="he" aria-label="Type a command or search games" style="flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px;">
        <span class="kbd">esc</span>
      </div>
      <div style="padding: 6px 8px 10px; display: flex; flex-direction: column;">
        <div class="menu-label">Games</div>
        <sc-for list="{{games}}" as="g" hint-placeholder-count="3">
          <div class="menu-item {{g.cls}}" style="height: 40px; gap: 12px;">
            <span class="thumb" style="background: {{g.bg}}; width: 22px;"></span>
            <span style="font-weight: 600;">{{g.title}}</span><span class="faint small">{{g.meta}}</span>
            <span class="kbd" style="display: {{g.kbd}};">Enter</span>
          </div>
        </sc-for>
        <div class="menu-label">Actions</div>
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
          <div class="menu-item" style="height: 36px;">{{a.name}}<span class="kbd">{{a.key}}</span></div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["oled","light","colorful","freaky"],"default":"oled"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { const themeClass = 'theme-' + (this.props.theme ?? 'oled');
    const cover = (a, b) => 'linear-gradient(160deg, ' + a + ', ' + b + ')';
    const games = [
      { title: 'Hades', meta: 'In Progress · 18 of 22 h', bg: cover('#9a2a42', '#2a0a1a'), cls: 'hover', kbd: 'inline-block' },
      { title: 'Hades II', meta: 'Completed', bg: cover('#6a2a9a', '#1a0a30'), cls: '', kbd: 'none' },
      { title: 'Hollow Knight', meta: 'In Progress · 9 of 27 h', bg: cover('#2a5aa8', '#0a1430'), cls: '', kbd: 'none' }
    ];
    const actions = [
      { name: 'Add game', key: '⌘N' },
      { name: 'Sync Steam playtimes', key: '⌘⇧S' },
      { name: 'Sync IGDB game data', key: '⌘⇧I' },
      { name: 'Open settings', key: '⌘,' }
    ];
    return { themeClass, games, actions };
  }
}
</script>
</body>
</html>
