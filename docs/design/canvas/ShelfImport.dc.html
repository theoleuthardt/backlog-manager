<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSV import</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shelf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="shelf win">
  <dc-import name="Titlebar" title="Import CSV" search="no" hint-size="100%,52px"></dc-import>
  <div class="win-body">
    <div class="sidebar-col" style="padding: 0;"><dc-import name="SidebarNav" active="import" hint-size="232px,620px"></dc-import></div>
    <div class="win-main">
      <div class="toolbar">
        <span class="chip chip-accent">backlog-2025.csv</span>
        <button type="button" class="btn">Choose another file</button>
        <span class="muted small" style="margin-left: auto;">312 rows &middot; 18 already in your backlog</span>
        <button type="button" class="btn btn-quiet">Cancel</button>
        <button type="button" class="btn btn-primary">Import 294 games</button>
      </div>
      <div class="scroll" style="flex-direction: row; gap: 20px; align-items: flex-start;">
        <section class="group" aria-label="Column mapping" style="flex: 0 0 360px;">
          <div class="group-title">Column mapping</div>
          <div class="group-desc">Pick which column holds which field.</div>
          <sc-for list="{{mapping}}" as="m" hint-placeholder-count="8">
            <div class="frow"><div class="fl" style="flex-basis: 120px; font-size: 13px;">{{m.label}}</div><div class="fc"><select aria-label="{{m.label}}"><option>{{m.value}}</option></select></div></div>
          </sc-for>
        </section>

        <section style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;" aria-label="Preview">
          <h2 class="h-section">Preview</h2>
          <div class="table">
            <div class="thead"><span style="width: 26px;"></span><span class="col-grow">Game</span><span style="width: 140px;">Result</span><span style="width: 110px;"></span></div>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <div class="trow">
                <span class="thumb" style="background: {{r.cover}};"></span>
                <div class="col-grow"><div style="font-weight: 700;">{{r.title}}</div><div class="faint small">{{r.meta}}</div></div>
                <span style="width: 140px;"><span class="chip {{r.chipCls}}">{{r.chip}}</span></span>
                <span style="width: 110px; text-align: right;"><button type="button" class="btn">{{r.action}}</button></span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </div>
  </div>
  <dc-import name="StatusBar" left="Import preview &middot; nothing written yet" hint-size="100%,28px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cover = (a, b) => 'linear-gradient(160deg, ' + a + ', ' + b + ')';
    const mapping = [
      { label: 'Title', value: 'Game' }, { label: 'Genre', value: 'Genre' }, { label: 'Platform', value: 'Platform' },
      { label: 'Status', value: 'Status' }, { label: 'Playtime', value: 'Hours played' }, { label: 'Rating', value: 'Score' },
      { label: 'Completed date', value: '-- none --' }, { label: 'Review columns', value: 'Reason finished' }
    ];
    const rows = [
      { title: 'Hades', meta: 'Roguelike · PC · Completed', chip: 'Owned', chipCls: 'chip-ok', action: 'Cover', cover: cover('#9a2a42', '#2a0a1a') },
      { title: 'Celeste', meta: 'Platformer · PC · In Progress', chip: 'Owned', chipCls: 'chip-ok', action: 'Cover', cover: cover('#2a8a8a', '#0e3a44') },
      { title: 'Crash Bandicoot N. Sane Trilogy', meta: 'Platformer · PlayStation · Not Started', chip: 'Check match', chipCls: 'chip-accent', action: 'Wrong game', cover: cover('#d2641e', '#3a1c08') },
      { title: 'Untitled Goose Game', meta: 'Puzzle · PC · Not Started', chip: 'No beat times', chipCls: '', action: 'Cover', cover: cover('#6a7a8a', '#1e2a36') },
      { title: 'A Way Out', meta: 'Adventure · PC · Completed', chip: 'No cover', chipCls: '', action: 'Cover', cover: cover('#4a6a8a', '#10202e') },
      { title: 'Overcooked: All you can eat', meta: 'Party · PC · Not Started', chip: 'Check match', chipCls: 'chip-accent', action: 'Wrong game', cover: cover('#c2a21e', '#3a2a06') }
    ];
    return { mapping, rows };
  }
}
</script>
</body>
</html>
