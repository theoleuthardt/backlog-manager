services:
  db:
    container_name: blm_db
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/backlogmanagerdb-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: blm_backend
    image: ${BACKEND_IMAGE:-ghcr.io/theoleuthardt/backlog-manager-backend:latest}
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command:
      - sh
      - -c
      - |
        set -e
        python -c "from backlog_manager_backend.config import settings"
        until alembic current >/dev/null 2>&1; do echo "waiting for the database"; sleep 2; done
        if [ -z "$$(alembic current 2>/dev/null)" ]; then alembic stamp head; fi
        alembic upgrade head
        exec uvicorn backlog_manager_backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
    restart: unless-stopped

  price-check-cron:
    container_name: blm_price-check-cron
    image: docker.io/curlimages/curl:latest
    environment:
      PRICE_CHECK_CRON_SECRET: ${PRICE_CHECK_CRON_SECRET}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
        curl --fail --connect-timeout 10 --max-time 300 --retry 5 --retry-delay 5 --retry-connrefused -X POST http://backend:8000/api/prices/check -H "X-Cron-Secret: $${PRICE_CHECK_CRON_SECRET}" || true
        sleep 21600
        done
    depends_on:
      - backend
    restart: unless-stopped

  steam-wishlist-sync-cron:
    container_name: blm_steam-wishlist-sync-cron
    image: docker.io/curlimages/curl:latest
    environment:
      PRICE_CHECK_CRON_SECRET: ${PRICE_CHECK_CRON_SECRET}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
        curl --fail --connect-timeout 10 --max-time 900 --retry 5 --retry-delay 5 --retry-connrefused -X POST http://backend:8000/api/steam/wishlist/auto-sync -H "X-Cron-Secret: $${PRICE_CHECK_CRON_SECRET}" || true
        sleep 3600
        done
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
